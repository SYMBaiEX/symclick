name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Universal macOS build
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and verify
        run: make clean verify

      - name: Package ad-hoc build
        run: make package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SymClick-macOS-universal
          path: |
            build/dist/*.zip
            build/dist/*.sha256
          if-no-files-found: error
